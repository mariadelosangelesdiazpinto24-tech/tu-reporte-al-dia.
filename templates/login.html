<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Los Ángeles del Dinero</title>
    
    <!-- Configuración PWA e Icono Oficial -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/templates/logo.png">
    <link rel="apple-touch-icon" href="/templates/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --color-primario: #e91e63;
            --color-secundario: #ffd54f;
            --color-dorado: #e6a100;
            --color-fondo: #fbf5f7;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #ffccd9, transparent 60%),
                        radial-gradient(circle at bottom left, #ffeaa7, transparent 60%),
                        linear-gradient(135deg, #fce4ec 0%, #fff9e6 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 2px solid rgba(255, 215, 79, 0.4);
            box-shadow: 0 12px 35px rgba(233, 30, 99, 0.12),
                        0 2px 8px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 420px;
            padding: 2.2rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--color-secundario);
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.25);
            background: #fff;
        }

        .titulo-empresa {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #d81b60 0%, #b71540 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
        }

        .subtitulo-empresa {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8c7b83;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .form-floating > .form-control {
            border-radius: 14px;
            border: 1.5px solid #f0d5df;
            background-color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .form-floating > .form-control:focus {
            border-color: var(--color-primario);
            box-shadow: 0 0 0 0.25rem rgba(233, 30, 99, 0.15);
            background-color: #ffffff;
        }

        .btn-ingresar {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.85rem;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.25);
            transition: all 0.2s ease-in-out;
        }

        .btn-ingresar:hover {
            background: linear-gradient(135deg, #d81b60 0%, #ad1457 100%);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(233, 30, 99, 0.35);
        }

        .btn-ingresar:active {
            transform: translateY(1px);
        }

        .badge-tropical {
            background: rgba(255, 213, 79, 0.25);
            color: #825a00;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.35rem 0.8rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Contenedor del Logo -->
        <div class="logo-container">
            <img src="/templates/logo.png" alt="Los Ángeles del Dinero" class="logo-img">
        </div>

        <div>
            <span class="badge-tropical">
                <i class="fas fa-clover text-warning"></i> Agencia Oficial 🌴
            </span>
            <h1 class="titulo-empresa">Los Ángeles del Dinero</h1>
            <p class="subtitulo-empresa">Plataforma Operativa</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 px-3 text-start small rounded-3 mb-3 border-0 shadow-sm" style="background-color: #ffebee; color: #c62828;">
                <i class="fas fa-circle-exclamation me-1"></i> {{ error }}
            </div>
        {% endif %}

        <!-- Formulario de Acceso -->
        <form action="/login" method="POST" class="text-start">
            <div class="form-floating mb-3">
                <input type="text" name="usuario" id="inputUsuario" class="form-control" placeholder="Agencia o Usuario" required autofocus>
                <label for="inputUsuario" class="text-muted"><i class="fas fa-user me-1 text-secondary"></i> Usuario o Agencia</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="clave" id="inputClave" class="form-control" placeholder="Contraseña" required>
                <label for="inputClave" class="text-muted"><i class="fas fa-lock me-1 text-secondary"></i> Contraseña</label>
            </div>

            <button type="submit" class="btn btn-ingresar">
                Entrar al Sistema <i class="fas fa-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="mt-4 pt-2 border-top text-muted small" style="font-size: 0.78rem;">
            <span>Sistema Seguro y Transparente 🍀</span>
        </div>
    </div>

</body>
</html>
