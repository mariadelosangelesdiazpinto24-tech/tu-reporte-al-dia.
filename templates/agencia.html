<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Taquilla - {{ agencia }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    {% if genero == 'MASCULINO' %}
    <!-- TEMA MASCULINO: AZUL CORPORATIVO Y DORADO -->
    <style>
        body { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .navbar-custom { background: linear-gradient(135deg, #0d47a1, #1976d2); color: white; padding: 15px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom: 4px solid #ffb300; }
        .card-custom { border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); border: none; margin-bottom: 20px; background: #ffffff; border-top: 5px solid #0d47a1; }
        .card-pago { border-top: 5px solid #1976d2 !important; }
        .nav-pills .nav-link { color: #0d47a1; font-weight: 600; background: white; margin-right: 8px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s ease; }
        .nav-pills .nav-link:hover { background-color: #e3f2fd; color: #0d47a1; }
        .nav-pills .nav-link.active { background: linear-gradient(135deg, #0d47a1, #1565c0) !important; color: white !important; box-shadow: 0 4px 12px rgba(13,71,161,0.3); }
        .tab-content-section { display: none; }
        .tab-content-section.active { display: block; }
        .btn-solicitar-banca { background: linear-gradient(135deg, #0d47a1, #1565c0); color: white; font-weight: bold; border: none; border-radius: 8px; padding: 6px 16px; }
        .btn-campanita { position: relative; background: #ffffff; color: #0d47a1; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .badge-notif { position: absolute; top: -2px; right: -2px; background-color: #ffb300; color: black; border-radius: 50%; padding: 3px 7px; font-size: 11px; font-weight: bold; }
        .titulo-pago { color: #0d47a1 !important; }
    </style>
    {% else %}
    <!-- TEMA FEMENINO: ROSADO TROPICAL, CAYENAS Y TRÉBOLES -->
    <style>
        body { background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .navbar-custom { background: linear-gradient(135deg, #c2185b, #e91e63); color: white; padding: 15px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom: 4px solid #2e7d32; }
        .card-custom { border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); border: none; margin-bottom: 20px; background: #ffffff; border-top: 5px solid #2e7d32; }
        .card-pago { border-top: 5px solid #e91e63 !important; }
        .nav-pills .nav-link { color: #c2185b; font-weight: 600; background: white; margin-right: 8px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s ease; }
        .nav-pills .nav-link:hover { background-color: #fce4ec; color: #880e4f; }
        .nav-pills .nav-link.active { background: linear-gradient(135deg, #2e7d32, #43a047) !important; color: white !important; box-shadow: 0 4px 12px rgba(46,125,50,0.3); }
        .tab-content-section { display: none; }
        .tab-content-section.active { display: block; }
        .btn-solicitar-banca { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; font-weight: bold; border: none; border-radius: 8px; padding: 6px 16px; }
        .btn-campanita { position: relative; background: #ffffff; color: #c2185b; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .badge-notif { position: absolute; top: -2px; right: -2px; background-color: #2e7d32; color: white; border-radius: 50%; padding: 3px 7px; font-size: 11px; font-weight: bold; }
        .titulo-pago { color: #e91e63 !important; }
    </style>
    {% endif %}
</head>
<body>

    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h3 class="m-0"><i class="fas fa-crown text-warning"></i> Los Ángeles del Dinero <span style="font-size: 16px; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; margin-left: 10px;">Taquilla: {{ agencia }} {% if genero == 'FEMENINO' %}🍀🌺{% else %}💼👑{% endif %}</span></h3>
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-campanita border-0" data-bs-toggle="modal" data-bs-target="#modalNotificaciones">
                <i class="fas fa-bell fa-lg"></i>
                {% set total_notifs = notificaciones | length + comunicados_pendientes | length %}
                {% if total_notifs > 0 %}
                    <span class="badge-notif">{{ total_notifs }}</span>
                {% endif %}
            </button>
            <a href="/login" class="btn btn-light btn-sm fw-bold text-danger shadow-sm"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>
    </div>

    <div class="container my-4">

        <div class="card card-custom card-pago p-4 mb-4">
            <h5 class="fw-bold mb-3 titulo-pago"><i class="fas fa-file-invoice-dollar"></i> Cargar Pago o Abono a Admin {% if genero == 'FEMENINO' %}🌺{% else %}⚡{% endif %}</h5>
            <form action="/reportar" method="POST" enctype="multipart/form-data" class="row g-3 align-items-end">
                <input type="hidden" name="agencia" value="{{ agencia }}">
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Fecha</label>
                    <input type="date" class="form-control" name="fecha" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">N° Referencia (4 dígitos)</label>
                    <input type="text" class="form-control" name="factura" placeholder="Ej: 8492" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Monto Abono / Pago (Bs.)</label>
                    <input type="text" class="form-control" name="monto" placeholder="Ej: 20000.00" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Comprobante (Imagen)</label>
                    <input type="file" class="form-control" name="comprobante" required>
                </div>
                <div class="col-12 text-end mt-3">
                    <button type="submit" class="btn btn-warning px-4"><i class="fas fa-paper-plane"></i> Registrar Abono / Pago</button>
                </div>
            </form>
        </div>

        <ul class="nav nav-pills mb-4 flex-wrap" id="pills-tab" role="tablist">
            <li class="nav-item mb-2"><button class="nav-link active" onclick="mostrarPestaña('mis-reportes')" id="btn-mis-reportes
