<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Agencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow">
            <h1 class="text-xl font-bold text-gray-800">Agencia: {{ nombre }}</h1>
            <a href="/" class="text-red-500 font-semibold">Cerrar Sesión</a>
        </div>

        <!-- Formulario Carga -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-4">Cargar Nuevo Pago</h2>
            <form action="/agencia/guardar_pago" method="POST" enctype="multipart/form-data" class="grid grid-cols-2 gap-4">
                <input type="hidden" name="agencia" value="{{ nombre }}">
                <div>
                    <label class="block text-sm">Fecha</label>
                    <input type="date" name="fecha" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm">Factura / Referencia</label>
                    <input type="text" name="factura" placeholder="Ej: C1734" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm">Monto (Bs)</label>
                    <input type="number" step="0.01" name="monto" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm">Comprobante (Foto/PDF)</label>
                    <input type="file" name="comprobante" required class="w-full border p-1 rounded">
                </div>
                <button type="submit" class="col-span-2 bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Enviar Pago</button>
            </form>
        </div>

        <!-- Historial -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-4">Mis Pagos Registrados</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b bg-gray-100">
                        <th class="p-2">Fecha</th>
                        <th class="p-2">Factura</th>
                        <th class="p-2">Monto</th>
                        <th class="p-2">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in historial %}
                    <tr class="border-b">
                        <td class="p-2">{{ p[0] }}</td>
                        <td class="p-2">{{ p[1] }}</td>
                        <td class="p-2">{{ p[2] }} Bs</td>
                        <td class="p-2 font-bold {% if p[3] == 'PENDIENTE' %}text-yellow-600{% else %}text-green-600{% endif %}">{{ p[3] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
